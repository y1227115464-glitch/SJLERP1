name: sjlerp
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: sjlerp
      POSTGRES_DB: sjlerp
      POSTGRES_PASSWORD: ${SJL_DB_PASSWORD:?Run scripts/dev.py init first}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sjlerp -d sjlerp"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:8.2.9
    environment:
      REDIS_PASSWORD: ${SJL_REDIS_PASSWORD:?Run scripts/dev.py init first}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
