name: sjlerp-nas

x-app: &app
  image: sjlerp-api:nas
  pull_policy: build
  build:
    context: ../..
    dockerfile: infra/nas/api.Dockerfile
  environment: &environment
    SJL_DATABASE_URL: postgresql+psycopg://sjlerp:${SJL_DB_PASSWORD:?Set NAS database password}@postgres:5432/sjlerp
    SJL_REDIS_URL: redis://:${SJL_REDIS_PASSWORD:?Set NAS Redis password}@redis:6379/0
    SJL_STORAGE_PATH: /data/storage
    SJL_ALLOWED_ORIGINS: ${SJL_ALLOWED_ORIGINS:?Set the browser origin}
    SJL_ENVIRONMENT: ${SJL_ENVIRONMENT:-local}
    SJL_COOKIE_SECURE: ${SJL_COOKIE_SECURE:-false}
    TZ: Asia/Shanghai
  volumes:
    - storage:/data/storage
  restart: unless-stopped
  init: true
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: sjlerp
      POSTGRES_DB: sjlerp
      POSTGRES_PASSWORD: ${SJL_DB_PASSWORD:?Set NAS database password}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sjlerp -d sjlerp"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging
  redis:
    image: redis:8.2.9
    environment:
      REDIS_PASSWORD: ${SJL_REDIS_PASSWORD:?Set NAS Redis password}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging
  bootstrap:
    <<: *app
    # The exported package is private (0600); only this one-shot importer reads it.
    user: "0:0"
    command: [sh, -c, "alembic upgrade head && python /app/scripts/nas_master_data.py import /migration/master-data.json"]
    restart: "no"
    volumes:
      - ../../migration:/migration:ro
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *app
    depends_on: &dependencies
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
  worker:
    <<: *app
    command: [python, -m, app.worker]
    depends_on: *dependencies
  scheduler:
    <<: *app
    command: [python, -m, app.tasks.worker]
    depends_on: *dependencies
  web:
    image: sjlerp-web:nas
    pull_policy: build
    build:
      context: ../..
      dockerfile: infra/nas/web.Dockerfile
    ports:
      - "${SJL_NAS_IP:?Set NAS LAN IP}:${SJL_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  storage:
